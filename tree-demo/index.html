<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>旅行树·中树挂框</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 单一蓝色场景：整屏 3D 树，二级区域框挂在枝头，底部是旋转控制 */
:root{
  --sky-top:#0b2a44; --sky-mid:#16507a; --glow:#cfe7f7;
  --box-bg:#f6fbff; --box-line:rgba(56,189,248,.9); --box-glow:rgba(56,189,248,.45);
  --name:#13314f; --date:#5b7088; --ink:#e8f4fc; --ink-dim:rgba(232,244,252,.66);
  --thread:rgba(232,244,252,.7);
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(120% 80% at 50% 78%,#2f7fae 0%,var(--sky-mid) 38%,var(--sky-top) 100%);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
#stage{position:relative;height:100vh;height:100dvh;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
#stage.drag{cursor:grabbing}
canvas{display:block;position:absolute;inset:0}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform-origin:50% 0;will-change:transform,opacity;pointer-events:auto;cursor:pointer}
.tag::before{content:"";position:absolute;left:50%;top:0;width:1px;height:var(--th,8px);background:var(--thread)}
.tag .knot{position:absolute;left:50%;top:-2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px var(--box-glow)}
.box{position:relative;top:var(--th,8px);transform:translateX(-50%);width:36px;padding:2px;border-radius:5px;background:var(--box-bg);
  box-shadow:0 0 0 1px var(--box-line),2px 3px 0 rgba(37,99,235,.35),3px 8px 12px rgba(5,20,45,.35),0 0 12px var(--box-glow)}
.box img{display:block;width:100%;aspect-ratio:4/3;border-radius:3px;object-fit:cover}
.box b{display:block;margin-top:1px;font-size:7px;line-height:9px;font-weight:600;color:var(--name);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box i{display:block;font-style:normal;font-family:var(--f-num);font-size:5.5px;line-height:7px;letter-spacing:0;color:var(--date);text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tag.mini .box{opacity:0;pointer-events:none;transform:translateX(-50%) scale(.6)}
.tag.mini::before{opacity:.4}
.box{transition:opacity .25s,transform .25s}
.tag.on .box{box-shadow:0 0 0 2px #fff,2px 3px 0 rgba(37,99,235,.35),3px 8px 12px rgba(5,20,45,.35),0 0 18px 4px var(--box-glow)}
header{position:absolute;left:0;right:0;top:0;padding-top:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.04em}
header p{margin:4px 0 0;font-size:12px;color:var(--ink-dim)}
.ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:12px;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctl button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(232,244,252,.4);background:rgba(11,42,68,.45);color:var(--ink);font-size:18px;cursor:pointer;backdrop-filter:blur(6px)}
.ctl button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ctl button[aria-pressed="true"]{background:rgba(232,244,252,.22)}
.ctl span{font-family:var(--f-num);font-size:12px;color:var(--ink-dim);min-width:4.5em;text-align:center;font-variant-numeric:tabular-nums}
#card{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);width:min(300px,calc(100% - 32px));padding:10px;border-radius:14px;background:var(--box-bg);color:var(--name);box-shadow:0 0 0 1px var(--box-line),0 16px 40px rgba(5,20,45,.45);display:flex;gap:10px;align-items:center}
#card img{width:96px;border-radius:8px;aspect-ratio:4/3;object-fit:cover;flex:none}
#card div{min-width:0}
#card b{display:block;font-size:16px}
#card small{display:block;font-size:12px;color:var(--date);margin-top:2px}
#card i{display:block;font-style:normal;font-family:var(--f-num);font-size:13px;color:var(--date);margin-top:6px}
</style>

function photo(seed){
  let s=0;for(const ch of seed)s=(s*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>((s=(s*1664525+1013904223)>>>0)/4294967296);
  const c=document.createElement('canvas');c.width=160;c.height=120;const g=c.getContext('2d');
  const h=rnd()*360, sky=g.createLinearGradient(0,0,0,120);
  sky.addColorStop(0,`hsl(${h},55%,${62+rnd()*14}%)`);sky.addColorStop(1,`hsl(${(h+40)%360},60%,86%)`);
  g.fillStyle=sky;g.fillRect(0,0,160,120);
  g.fillStyle=`hsla(45,90%,92%,.9)`;g.beginPath();g.arc(30+rnd()*100,22+rnd()*20,8+rnd()*6,0,7);g.fill();
  for(let k=0;k<3;k++){
    g.fillStyle=`hsl(${(h+150+k*20)%360},${30+k*10}%,${50-k*12}%)`;g.beginPath();g.moveTo(0,120);
    let y=60+k*16+rnd()*10;g.lineTo(0,y);
    for(let x=0;x<=160;x+=20){y+= (rnd()-.5)*24;g.lineTo(x,Math.max(40,Math.min(110,y)));}
    g.lineTo(160,120);g.fill();
  }
  return c.toDataURL('image/jpeg',.8);
}

  const pa=TREE.par[i];if(pa<0)continue;
  const a=P[pa],b=P[i],len=a.distanceTo(b);
  const geo=new THREE.CylinderGeometry(TREE.r[i],TREE.r[pa],len,TREE.r[pa]>.05?12:6,1,true);
  const m=new THREE.Mesh(geo,bark);m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(up,b.clone().sub(a).normalize());tree.add(m);
  if(TREE.r[i]>.02){const j=new THREE.Mesh(new THREE.SphereGeometry(TREE.r[i],10,8),bark);j.position.copy(b);tree.add(j);}
}
// 树根：从根部向四周伸出几条
for(let k=0;k<5;k++){
  const ang=k/5*Math.PI*2+.4,rr=TREE.r[0]*.55;
  const g=new THREE.ConeGeometry(rr,.5,8,1,true);const m=new THREE.Mesh(g,bark);
  m.position.set(Math.cos(ang)*.2,.06,Math.sin(ang)*.2);m.rotation.set(Math.sin(ang)*1.2,0,-Math.cos(ang)*1.2);tree.add(m);
}
// 叶子：贴图带透明边，长在新的细枝上
const lc=document.createElement('canvas');lc.width=lc.height=64;const lg=lc.getContext('2d');
lg.fillStyle='#fff';lg.beginPath();lg.moveTo(32,2);lg.bezierCurveTo(58,18,56,46,32,62);lg.bezierCurveTo(8,46,6,18,32,2);lg.fill();
const ltex=new THREE.CanvasTexture(lc);
const leafMat=new THREE.MeshStandardMaterial({map:ltex,alphaTest:.5,side:THREE.DoubleSide,roughness:.6});
const tips=[];for(let i=0;i<n;i++)if(TREE.r[i]<.066&&TREE.age[i]<=70&&P[i].y>1.2)tips.push(i);
const LPER=14,leaves=new THREE.InstancedMesh(new THREE.PlaneGeometry(.11,.16),leafMat,tips.length*LPER);
let li=0,rs=7;const rr=()=>((rs=(rs*16807)%2147483647)/2147483647);
const dm=new THREE.Object3D(),col=new THREE.Color();
for(const i of tips)for(let k=0;k<LPER;k++){
  dm.position.set(P[i].x+(rr()-.5)*.44,P[i].y+(rr()-.6)*.3,P[i].z+(rr()-.5)*.44);
  dm.rotation.set(rr()*6.3,rr()*6.3,rr()*6.3);const s=.8+rr()*.6;dm.scale.set(s,s,s);dm.updateMatrix();
  leaves.setMatrixAt(li,dm.matrix);
  const t=Math.min(1,Math.max(0,(dm.position.y-1.4)/2.4))*.55+rr()*.45;
  col.setRGB(.05+.25*t,.2+.34*t,.04+.08*t);leaves.setColorAt(li++,col);
}
tree.add(leaves);
// 地面光
const gc=document.createElement('canvas');gc.width=gc.height=256;const gg=gc.getContext('2d');
const rg=gg.createRadialGradient(128,128,0,128,128,128);rg.addColorStop(0,'rgba(240,248,252,.95)');rg.addColorStop(.35,'rgba(200,228,242,.5)');rg.addColorStop(1,'rgba(120,180,215,0)');
gg.fillStyle=rg;gg.fillRect(0,0,256,256);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(9,9),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(gc),transparent:true,depthWrite:false}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
const sh=new THREE.Mesh(new THREE.CircleGeometry(1.1,40),new THREE.MeshBasicMaterial({color:0x163a55,transparent:true,opacity:.28,depthWrite:false}));
sh.rotation.x=-Math.PI/2;sh.position.y=.005;scene.add(sh);

// 区域框
const tagsEl=document.getElementById('tags'),card=document.getElementById('card');
const tags=PLACES.map(([prov,city,date],k)=>{
  const el=document.createElement('div');el.className='tag';
  const src=photo(city);
  el.innerHTML=`<span class="knot"></span><div class="box"><img alt="" src="${src}"><b>${city}</b><i>${fmt(date)}</i></div>`;
  el.style.setProperty('--th',(6+(k*7)%3*5)+'px');
  tagsEl.appendChild(el);
  const node=TREE.slots[k],pos=P[node].clone();
  const t={el,pos,prov,city,date,src};
  el.addEventListener('click',e=>{e.stopPropagation();select(t);});
  return t;
});
let sel=null;
function select(t){
  if(sel)sel.el.classList.remove('on');
  if(sel===t||!t){sel=null;card.hidden=true;return;}
  sel=t;t.el.classList.add('on');
  card.innerHTML=`<img alt="" src="${t.src}"><div><b>${t.city}</b><small>${t.prov}</small><i>点亮于 ${fmt(t.date)}</i></div>`;
  card.hidden=false;
}

// 只绕竖轴左右旋转：拖动、按钮、方向键，松手后有惯性
let rot=.3,vel=0,auto=!matchMedia('(prefers-reduced-motion: reduce)').matches,drag=null,moved=0;
const autoBtn=document.getElementById('auto');autoBtn.setAttribute('aria-pressed',auto);
autoBtn.onclick=()=>{auto=!auto;autoBtn.setAttribute('aria-pressed',auto);};
const nudge=d=>{vel+=d;};
document.getElementById('l').onclick=()=>nudge(-.06);
document.getElementById('r').onclick=()=>nudge(.06);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')nudge(-.05);if(e.key==='ArrowRight')nudge(.05);});
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button,.tag'))return;drag={x:e.clientX,t:performance.now()};moved=0;stage.classList.add('drag');stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,now=performance.now();
  const d=dx/innerWidth*Math.PI*1.4;rot+=d;vel=d/Math.max(8,now-drag.t)*16;drag={x:e.clientX,t:now};moved+=Math.abs(dx);});
const end=()=>{if(drag&&moved<4)select(null);drag=null;stage.classList.remove('drag');};
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);

function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;
  const t=Math.tan(17*Math.PI/180),dist=Math.max(2.25/t,1.3/(t*cam.aspect)); // 竖向放下整棵树；手机上树冠可以贴近屏幕两边
  cam.position.set(0,2.2,dist);cam.lookAt(0,2.05,0);cam.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();
new ResizeObserver(resize).observe(stage);

const v=new THREE.Vector3(),degEl=document.getElementById('deg');
function frame(){
  if(!drag){rot+=vel;vel*=.93;if(auto&&Math.abs(vel)<.002)rot+=.0025;}
  tree.rotation.y=rot;tree.updateMatrixWorld();R.render(scene,cam);
  const w=stage.clientWidth,h=stage.clientHeight,scale=Math.min(1.3,Math.max(.9,Math.min(w*1.4,h)/700));
  if(cv.width!==Math.round(w*R.getPixelRatio()))resize();
  const kept=[],order=[];
  for(const t of tags){
    v.copy(t.pos).applyMatrix4(tree.matrixWorld);
    const depth=v.z; // >0 朝向观众
    v.project(cam);
    const x=(v.x+1)/2*w,y=(1-v.y)/2*h,f=Math.max(0,Math.min(1,(depth+.35)/.9));
    const s=scale*(.62+.38*f);
    t.el.style.transform=`translate(${x}px,${y}px) scale(${s})`;
    t.el.style.opacity=t===sel?1:(.25+.75*f).toFixed(2);
    t.el.style.zIndex=Math.round(depth*100)+200;
    t.el.style.pointerEvents=f>.15?'auto':'none';
    order.push([depth,x,y,s,t]);
  }
  // 互相遮挡时，靠前的框完整显示，被挡住的只留挂点，转过来再显示
  order.sort((a,b)=>b[0]-a[0]);
  for(const [d,x,y,s,t] of order){
    const bw=36*s,bh=44*s,top=y+11*s;
    const hit=t!==sel&&(d<-.2||kept.some(k=>Math.abs(k[0]-x)<bw*.8&&Math.abs(k[1]-top)<bh*.75));
    t.el.classList.toggle('mini',hit);if(!hit)kept.push([x,top]);
  }
  let d=((rot*180/Math.PI)%360+360)%360;degEl.textContent=Math.round(d)+'°';
  requestAnimationFrame(frame);
}
frame();
</script>
</body></html>
